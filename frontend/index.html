<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healthcare Triage Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div>
    <h1>🩺 Healthcare Triage Assistant</h1>
    <div class="sub">Not a diagnosis. Helps you find the right level of care.</div>
  </div>
  <nav><a href="/dashboard">Doctor Dashboard →</a></nav>
</header>
<div class="disclaimer-bar">⚠️ If this is a medical emergency, call your local emergency number immediately.</div>

<div class="container">
  <div class="controls-row">
    <label for="lang" style="font-size:13px;color:#64748b;">Language:</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="hi">हिंदी (Hindi)</option>
    </select>
    <span style="font-size:12px;color:#94a3b8;" id="patientIdLabel"></span>
  </div>

  <div class="chat-card">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <button class="mic" id="micBtn" title="Voice input">🎤</button>
      <input type="text" id="textInput" placeholder="Type your answer..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="new-session-row">
    <button id="newSessionBtn">Start New Session</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
